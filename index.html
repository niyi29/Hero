<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero — Daniel Adegboyega</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--surface:#F5F5F5;
--primary:#232323;
--muted:#707070;
--accent:#3F8DF2;
--line:#DADADA;
--font:'Geist',system-ui,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* preview-only nav (hidden when embedded in an iframe) */
.preview-nav{position:fixed;top:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));background:rgba(239,239,239,.7);backdrop-filter:blur(12px);z-index:20;font-size:15px;font-weight:500}
.preview-nav .links{display:flex;gap:32px;color:var(--muted)}
.preview-nav .cta{background:var(--primary);color:#fff;border-radius:999px;padding:12px 22px;font-weight:600}
.embedded .preview-nav{display:none}
/* ── HERO ── */
#hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;padding:96px 0 88px}
.embedded #hero{padding-top:48px}
.orb{position:absolute;border-radius:50%;background:linear-gradient(145deg,#fff 0%,#EFEFEF 100%);box-shadow:0 30px 80px rgba(0,0,0,.06),inset 0 0 0 1px rgba(255,255,255,.8);pointer-events:none}
.orb.tl{width:480px;height:480px;left:-260px;top:-120px;opacity:.9}
.orb.br{width:420px;height:420px;right:-210px;bottom:56px;opacity:.9}
.wrap{position:relative;z-index:2;width:100%;max-width:1200px;margin:0 auto;padding:0 48px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:56px}
.left h1{font-weight:600;font-size:clamp(48px,6.4vw,92px);line-height:1.02;letter-spacing:-.04em;margin-bottom:32px}
.left h1 .accent{color:var(--accent)}
.left p{font-size:20px;line-height:1.6;color:var(--muted);max-width:480px}
.left p strong{color:var(--primary);font-weight:600}
/* ── COMPUTER ── */
.right{display:flex;flex-direction:column;align-items:center;user-select:none}
.computer-frame{position:relative;width:100%;max-width:420px;line-height:0}
.scene{width:100%;display:block;image-rendering:pixelated;cursor:pointer;position:relative;z-index:1;filter:drop-shadow(0 24px 30px rgba(0,0,0,.08));}
.screen-overlay{position:absolute;left:24.5%;top:10.1%;width:31.1%;height:27.9%;background:#1a261a;overflow:hidden;z-index:2;opacity:0;transition:opacity .2s;pointer-events:none;border-radius:1px}
.screen-overlay.active{opacity:1}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 3px);z-index:3;pointer-events:none}
.screen-text{padding:5px 6px;font-family:ui-monospace,Menlo,monospace;font-size:clamp(5px,1.35vw,8.5px);line-height:1.5;color:#a8ff78;white-space:pre;position:relative;z-index:2}
.progress-wrap{margin:3px 6px 0;height:3px;background:#1a3a1a;border-radius:2px;overflow:hidden;position:relative;z-index:2}
.progress-fill{height:100%;width:0;background:#4ade80;border-radius:2px}
.power{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;transition:opacity .3s}
.power.hidden{opacity:0;pointer-events:none}
.power span{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.power button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--primary);background:transparent;color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.power button:hover{background:var(--primary);color:#fff;transform:scale(1.06)}
.power button:active{transform:scale(.95)}
.power button.spinning svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── WIN POPUPS ── */
.error-layer{position:absolute;inset:0 -30px;pointer-events:none;z-index:10}
.win-popup{position:absolute;width:min(230px,52%);background:#ECE9D8;border:1px solid #848284;box-shadow:2px 2px 0 #fff inset,-1px -1px 0 #424142 inset,3px 3px 10px rgba(0,0,0,.28);font-family:Tahoma,Verdana,sans-serif;font-size:11px;opacity:0;transform:scale(.85) translateY(8px);transition:opacity .2s,transform .2s;pointer-events:all;line-height:1.4}
.win-popup.show{opacity:1;transform:none}
.win-titlebar{background:linear-gradient(to bottom,#0A246A,#3A6EA5);color:#fff;font-weight:bold;padding:3px 4px 3px 6px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.win-titlebar-left{display:flex;align-items:center;gap:4px}
.win-close{width:16px;height:14px;background:linear-gradient(to bottom,#f8b4b4,#e0302a);border:1px solid #8b0000;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px}
.win-body{padding:10px 10px 8px;display:flex;gap:8px;align-items:flex-start;color:#000}
.win-icon{width:28px;height:28px;flex-shrink:0}
.win-footer{display:flex;justify-content:center;padding:0 8px 8px;gap:6px}
.win-btn{background:linear-gradient(to bottom,#fff,#DCDCDC);border:1px solid #848284;box-shadow:1px 1px 0 #fff inset;padding:3px 16px;font-size:11px;font-family:inherit;cursor:pointer;min-width:60px}
.win-btn:hover{background:linear-gradient(to bottom,#EEF4FF,#C8D8F0)}
/* ── SCROLL INDICATOR ── */
.scroll{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.scroll .track{width:1px;height:28px;background:linear-gradient(to bottom,transparent,rgba(35,35,35,.18));position:relative;overflow:hidden}
.scroll .track::after{content:"";position:absolute;left:0;top:-100%;width:1px;height:100%;background:var(--primary);animation:slide 1.8s ease-in-out infinite}
@keyframes slide{0%{top:-100%}60%,100%{top:100%}}
.scroll span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--primary);opacity:.6}
/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(16px);animation:rise .7s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:900px){
.wrap{padding:0 32px}
.grid{gap:32px}
.left p{font-size:18px}
.computer-frame{max-width:340px}
.orb.br{width:300px;height:300px;right:-150px}
#hero{padding-bottom:110px}
}
@media (max-width:700px){
.wrap{padding:0 24px}
.grid{grid-template-columns:1fr;gap:36px;text-align:center;justify-items:center}
.left{display:flex;flex-direction:column;align-items:center}
.left p{margin:0 auto}
.computer-frame{max-width:320px;margin:0 auto}
}
</style>
</head>

<div class="screen-overlay" id="screenOverlay">
<div class="scanlines"></div>
<div class="screen-text" id="screenText"></div>
<div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="error-layer" id="errorLayer"></div>
</div>
<div class="power" id="power">
<span>power me up</span>
<button id="powerBtn" aria-label="Power on computer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
</button>
</div>
</div>
</div>
</div>
<div class="scroll"><div class="track"></div><span>Scroll</span></div>
</section>
<script>
if (window.self !== window.top) document.documentElement.classList.add('embedded');
// retro sound
let _ctx=null; const getCtx=()=>_ctx||(_ctx=new (window.AudioContext||window.webkitAudioContext)());
function beep(type){
try{
const c=getCtx(), now=c.currentTime;
const tone=(f0,f1,dur,vol,start=0)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(f0,now+start);if(f1)o.frequency.exponentialRampToValueAtTime(f1,now+start+dur*.5);g.gain.setValueAtTime(vol,now+start);g.gain.exponentialRampToValueAtTime(.001,now+start+dur);o.connect(g);g.connect(c.destination);o.start(now+start);o.stop(now+start+dur)};
if(type==='click')tone(440,880,.08,.08);
else if(type==='error')tone(440,110,.18,.07);
else if(type==='power')[220,330,440,660].forEach((f,i)=>tone(f,0,.12,.07,i*.06));
}catch(e){}
}
const $=id=>document.getElementById(id);
const scene=$('scene'),errorLayer=$('errorLayer'),overlay=$('screenOverlay'),screenText=$('screenText'),pw=$('progressWrap'),pf=$('progressFill'),power=$('power'),powerBtn=$('powerBtn');
const BOOT=[
{t:'DA PORTFOLIO OS v1.0',c:'#a8ff78',d:0},
{t:'Booting system...',c:'#68cf68',d:400},
{t:'Loading: UI/UX Designer',c:'#68cf68',d:800},
{t:'Health · Retail · AI',c:'#68cf68',d:1200},
];
const ERRORS=[
{title:'Obscure Error',icon:'x',msg:'The program at 0x0F43df5a referenced memory at 0x00000000. Portfolio may be too good to load.',btns:['OK']},
{title:'Critical Error',icon:'x',msg:'An error has occurred while trying to display an error message.',btns:['OK']},
{title:'Warning',icon:'!',msg:'Client has requested Comic Sans. Initiating emergency protocols.',btns:['Ignore','Cancel']},
{title:'Microsoft Design',icon:'x',msg:'Not enough memory. Delete design system to continue.',btns:['No']},
{title:'System Error',icon:'x',msg:'Out of screen space for error messages. Too many popups.',btns:['OK']},
];
const POS=[[4,2],[40,22],[0,50],[34,6],[14,36]]; // percentages of the frame
let state='idle',timers=[];
const clear=()=>{timers.forEach(clearTimeout);timers=[]};
const after=(fn,ms)=>timers.push(setTimeout(fn,ms));
function popup(e,[x,y]){
const el=document.createElement('div');
el.className='win-popup';el.style.left=x+'%';el.style.top=y+'%';
const icon=e.icon==='!'
?'<svg class="win-icon" viewBox="0 0 32 32"><polygon points="16,3 30,29 2,29" fill="#f0c000" stroke="#888"/><text x="15" y="26" text-anchor="middle" font-size="18" font-weight="bold">!</text></svg>'
:'<svg class="win-icon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#cc0000"/><text x="16" y="22" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">✕</text></svg>';
el.innerHTML=`<div class="win-titlebar"><div class="win-titlebar-left"><svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#c00"/><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">✕</text></svg>${e.title}</div><div class="win-close">✕</div></div><div class="win-body">${icon}<div>${e.msg}</div></div><div class="win-footer">${e.btns.map(b=>`<button class="win-btn">${b}</button>`).join('')}</div>`;
errorLayer.appendChild(el);
requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('show');beep('error')}));
el.querySelectorAll('.win-btn,.win-close').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();beep('click');el.classList.remove('show');setTimeout(()=>el.remove(),200)}));
}
function boot(){
state='booting';power.classList.add('hidden');powerBtn.classList.add('spinning');
screenText.innerHTML='';pw.style.display='none';pf.style.transition='none';pf.style.width='0';
overlay.classList.add('active');
BOOT.forEach(({t,c,d})=>after(()=>{const l=document.createElement('div');l.textContent=t;l.style.color=c;screenText.appendChild(l)},d));
after(()=>{pw.style.display='block';requestAnimationFrame(()=>{pf.style.transition='width 2.2s ease';pf.style.width='100%'})},1400);
after(()=>{if(state!=='booting')return;state='running';errors()},3000);
}
function errors(){
ERRORS.forEach((e,i)=>after(()=>{if(state==='running')popup(e,POS[i])},i*1600));
after(()=>{state='crashing';errorLayer.innerHTML='';screenText.innerHTML='<div style="color:#ff4444">SYSTEM FAILURE</div><div style="color:#aa3333">Too many errors.</div><div style="color:#aa3333">Shutting down...</div>';pw.style.display='none'},ERRORS.length*1600+800);
after(()=>{overlay.classList.remove('active');powerBtn.classList.remove('spinning');power.classList.remove('hidden');state='idle'},ERRORS.length*1600+2800);
}
function tryBoot(){if(state==='idle'){clear();errorLayer.innerHTML='';beep('power');boot()}}
scene.addEventListener('click',tryBoot);
powerBtn.addEventListener('click',e=>{e.stopPropagation();tryBoot()});
</script>
</body>
